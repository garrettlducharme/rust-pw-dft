name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Fetch pinned silicon pseudopotential fixture
        run: |
          curl --fail --location \
            https://gitlab.com/QEF/q-e/-/raw/qe-7.6/EPW/examples/sic/pp/Si.pz-vbc.UPF \
            --output pseudopotentials/Si.pz-vbc.UPF
          echo 'd75dd6b0be0aa10587fc95900cfd6ba7314d461a8276a81df34f009d0bfc075d  pseudopotentials/Si.pz-vbc.UPF' \
            | sha256sum --check
      - name: Verify fixture provenance manifest
        run: cargo run --locked -- verify-fixtures
      - run: cargo test --locked

  macos-metal-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --features metal -- -D warnings
      - run: cargo test --locked --features metal --no-run
