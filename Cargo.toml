[package]
name = "rust-pw-dft"
version = "0.15.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A fail-closed plane-wave DFT prototype for Apple Silicon GPUs"
build = "build.rs"

[features]
default = []
metal = []

[dependencies]
anyhow = "1.0"
bincode = { version = "2.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
faer = "0.22"
hex = "0.4"
libm = "0.2"
num-complex = { version = "0.4", features = ["serde"] }
rand = "0.9"
rand_chacha = "0.9"
rmp-serde = "1.3"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.9"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "rust-pw-dft"
path = "src/main.rs"
